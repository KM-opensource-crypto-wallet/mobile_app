pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'coinswallet'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Expo modules required for @xmtp/react-native-sdk v5
// (not picked up by RN auto-linker — they use expo-module.config.json)
include ':expo-modules-core'
project(':expo-modules-core').projectDir = new File(rootProject.projectDir, '../node_modules/expo-modules-core/android')

include ':expo-xmtp-react-native-sdk'
project(':expo-xmtp-react-native-sdk').projectDir = new File(rootProject.projectDir, '../node_modules/@xmtp/react-native-sdk/android')
